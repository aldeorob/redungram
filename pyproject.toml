[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "aldeorob-redungram"
version = "0.1.0"
description = "把提示词拆成角色、任务、约束、示例、格式五层，追踪同一信息在几层里重复出现"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "aldeorob" }]
keywords = ["llm", "cli", "analysis", "observability"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://aldeorob.github.io"
Repository = "https://github.com/aldeorob/redungram"
Issues = "https://github.com/aldeorob/redungram/issues"

[project.scripts]
redungram = "redungram:main"

[tool.setuptools]
py-modules = ["redungram"]
